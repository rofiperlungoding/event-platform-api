# Dev stack — cuma database, app jalan via `pnpm dev` di laptop
services:
  db:
    image: postgres:16-alpine
    container_name: event-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rofi
      POSTGRES_PASSWORD: devsecret
      POSTGRES_DB: eventplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rofi -d eventplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
