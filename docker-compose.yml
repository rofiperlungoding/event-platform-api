# Docker Compose configuration for the Event Platform API.
#
# This stack runs on any Docker host (developer laptop, VPS, Kubernetes-
# adjacent infrastructure). It is an alternative to the reference
# tablet-based deployment described in docs/INSTALL.md.
#
# Quick start:
#   docker compose up -d
#   open http://localhost:3000/health

services:

  db:
    image: postgres:18-alpine
    container_name: event-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-rofi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsecret}
      POSTGRES_DB:       ${POSTGRES_DB:-eventplatform}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rofi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: event-platform-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:           3000
      DATABASE_URL:   postgresql://${POSTGRES_USER:-rofi}:${POSTGRES_PASSWORD:-devsecret}@db:5432/${POSTGRES_DB:-eventplatform}
      JWT_SECRET:     ${JWT_SECRET:-change-this-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-this-too}
      STATIC_DIR:     /var/lib/event-platform/static
    volumes:
      # Mount the frontend repo as static assets. Adjust path as needed.
      - ../event-platform-console:/var/lib/event-platform/static:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
