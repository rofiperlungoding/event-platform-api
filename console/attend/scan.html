<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0f1419"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Check In</title>
<link rel="manifest" href="/attend/manifest.json"/>
<link rel="icon" href="/attend/icon-192.svg"/>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#0f1419;--card:#1c2530;--accent:#ec7211;--green:#2e8b57;--red:#f85149;--text:#e8eaed;--muted:#8b949e;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:18px;margin-bottom:4px}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:8px;padding:20px;width:100%;max-width:400px;margin-bottom:16px}
.card h2{font-size:14px;color:var(--muted);margin-bottom:12px}
input{width:100%;padding:10px 12px;margin-bottom:10px;background:#0f1419;border:1px solid #333;border-radius:4px;color:var(--text);font-size:14px}
.btn{width:100%;padding:12px;border:none;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:8px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#d4650f}
.btn-scan{background:var(--green);color:#fff;font-size:16px;padding:16px}
.btn-scan:hover{background:#257a48}
.status{text-align:center;padding:16px;border-radius:8px;margin-bottom:16px;font-weight:600;font-size:15px;display:none;width:100%;max-width:400px}
.status.success{display:block;background:#1a3a2a;color:#4ade80;border:1px solid #2e8b57}
.status.error{display:block;background:#3a1a1a;color:#f85149;border:1px solid #f85149}
.status.info{display:block;background:#1a2a3a;color:#58a6ff;border:1px solid #58a6ff}
.status.queued{display:block;background:#3a2a1a;color:#ec7211;border:1px solid #ec7211}
.user-info{text-align:center;margin-bottom:16px}
.user-info .name{font-size:20px;font-weight:700}
.user-info .team{color:var(--accent);font-family:var(--mono);font-size:13px;margin-top:4px}
.user-info .device{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:4px}
#reader{width:100%;max-width:400px;margin-bottom:16px;border-radius:8px;overflow:hidden}
.hidden{display:none!important}
.history{width:100%;max-width:400px}
.history h3{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.history-item{padding:10px 12px;background:var(--card);border-radius:4px;margin-bottom:4px;font-size:13px;display:flex;align-items:center;gap:8px}
.history-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.history-item .dot.synced{background:var(--green)}
.history-item .dot.pending{background:var(--accent)}
.history-item .text{font-family:var(--mono);color:var(--muted)}
.offline-badge{position:fixed;top:8px;right:8px;background:var(--red);color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;font-family:var(--mono);display:none}
.offline-badge.show{display:block}
.queue-count{font-family:var(--mono);color:var(--accent);font-size:12px;transition:color .2s}
.queue-count.stale{color:var(--red);font-weight:700}
</style>
</head>
<body>
<div class="offline-badge" id="offline-badge">OFFLINE</div>
<h1>📋 Absensi Kegiatan</h1>
<p class="sub">scan QR · bekerja offline</p>

<div id="status" class="status"></div>

<!-- Auth Phase -->
<div class="card" id="auth-card">
  <h2>Daftar atau Login</h2>
  <input id="a-name" placeholder="Nama lengkap"/>
  <input id="a-email" placeholder="Email" type="email"/>
  <input id="a-team" placeholder="Tim / kelompok"/>
  <input id="a-password" placeholder="Password (min. 6 karakter)" type="password"/>
  <button class="btn btn-primary" onclick="authRegister()">Daftar & Tautkan HP</button>
  <button class="btn btn-primary" style="background:#333" onclick="authLogin()">Sudah punya akun? Login</button>
  <p class="muted-hint" id="browser-warn" style="display:none;font-size:11px;margin-top:8px;color:#f85149">
    ⚠ Buka via Chrome / Safari biasa untuk fitur offline penuh. Browser dalam aplikasi (WhatsApp / Instagram) tidak mendukung Service Worker.
  </p>
</div>

<!-- Scan Phase -->
<div class="hidden" id="scan-phase">
  <div class="user-info">
    <div class="name" id="user-name">—</div>
    <div class="team" id="user-team">—</div>
    <div class="device" id="user-device">—</div>
  </div>
  <button class="btn btn-scan" id="btn-start-scan" onclick="startScan()">📷 Scan QR untuk Absen</button>
  <button class="btn btn-primary" id="btn-manual" style="background:#333" onclick="showManualEntry()">⌨ Masukkan kode manual</button>
  <div id="manual-entry" class="hidden">
    <input id="manual-code" placeholder="Kode 8 huruf" style="font-family:var(--mono);text-transform:uppercase;letter-spacing:0.1em" maxlength="100"/>
    <button class="btn btn-primary" onclick="submitManualCode()">Absen</button>
  </div>
  <div id="reader"></div>
  <div class="history" id="history">
    <h3><span>Riwayat absen</span><span class="queue-count" id="queue-count"></span></h3>
  </div>
</div>

<script>
/* ─── API endpoint resolver ───────────────────────────────────────────
 * On a venue Wi-Fi, every attendee can reach the tablet at its LAN IP
 * directly — bypassing the Cloudflare Tunnel entirely. The tunnel is
 * only needed for attendees on cellular or off-network. We probe the
 * LAN endpoint with a 1.5 s timeout once per page load; if it answers,
 * we use it for the rest of the session. Otherwise we fall back to the
 * public tunnel hostname.
 *
 * Operators can override the LAN IP via ?lan=... query string or
 * localStorage `ep_lan_url` so the same PWA works on different
 * deployments. */
/* ─── API endpoint resolver ───────────────────────────────────────────
 * On a venue Wi-Fi, every attendee can reach the tablet at its LAN IP
 * directly — bypassing the Cloudflare Tunnel entirely. The tunnel is
 * only needed for attendees on cellular or off-network. We probe the
 * LAN endpoint with a 1.5 s timeout once per page load; if it answers,
 * we use it for the rest of the session. Otherwise we fall back to
 * the public tunnel hostname.
 *
 * Failure resilience (audit items 52, 54, 87, 89):
 *   - Multiple LAN candidates can be configured via ep_lan_urls (comma
 *     separated). The first one to respond wins.
 *   - If the live API endpoint stops responding mid-session, the
 *     scanner re-runs resolveApi() on the next failure and switches
 *     transparently. Captive portals or DHCP renumbering recover
 *     automatically.
 *   - If neither LAN nor tunnel responds, all check-ins land in the
 *     IndexedDB queue and drain when any endpoint comes back. */
const PUBLIC_API = 'https://api.rofidoesthings.site';
const DEFAULT_LAN_API = 'http://192.168.100.67:3001';
const LAN_OVERRIDE = new URL(location.href).searchParams.get('lan')
                  || localStorage.getItem('ep_lan_url')
                  || DEFAULT_LAN_API;
const LAN_LIST = (localStorage.getItem('ep_lan_urls') || LAN_OVERRIDE).split(',').map(s => s.trim()).filter(Boolean);
let API = PUBLIC_API;
let endpointHealthy = false;

async function probeOnce(url) {
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(`${url}/health`, {
      signal: ctl.signal, cache: 'no-store',
      redirect: 'manual',     // captive portals redirect; manual = we see the response
    });
    clearTimeout(t);
    if (r.type === 'opaqueredirect' || (r.status >= 300 && r.status < 400)) {
      console.warn(`[api] ${url} returned redirect — captive portal?`);
      return false;
    }
    if (r.ok) {
      const d = await r.json().catch(() => ({}));
      /* Server clock cross-check (audit item 76): if server time
       * differs from client by > 60 s the tokens won't validate
       * reliably; bail with a clear message instead of silently
       * letting the user fail. */
      if (d.server_time) {
        const drift = Math.abs(Date.now() / 1000 - d.server_time);
        if (drift > 60) {
          console.warn(`[api] ${url} clock skew ${drift|0}s; refusing endpoint`);
          return false;
        }
      }
      return true;
    }
  } catch (_) {}
  return false;
}

async function resolveApi() {
  /* Try every LAN candidate in parallel; whichever answers first wins. */
  if (LAN_LIST.length) {
    const winner = await Promise.race(LAN_LIST.map(async url => {
      if (await probeOnce(url)) return url;
      throw new Error('lan-fail');
    }).concat([new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1800))]))
      .catch(() => null);
    if (winner) {
      console.log('[api] LAN endpoint:', winner);
      endpointHealthy = true;
      return winner;
    }
  }
  /* Fallback: public tunnel */
  if (await probeOnce(PUBLIC_API)) {
    console.log('[api] tunnel endpoint');
    endpointHealthy = true;
    return PUBLIC_API;
  }
  console.warn('[api] no endpoint reachable; check-ins will queue offline');
  endpointHealthy = false;
  return PUBLIC_API;
}

/* Re-resolve mid-session if a request fails. Cheap (probes complete
 * in < 2 s) and idempotent. */
async function reresolve() {
  const old = API;
  API = await resolveApi();
  if (API !== old) console.log(`[api] switched ${old} → ${API}`);
}
let token = localStorage.getItem('ep_token') || '';
let deviceId = localStorage.getItem('ep_device_id') || '';
let userName = '', userTeam = '';
let scanner = null;
let isOnline = navigator.onLine;

// Device ID — polyfill randomUUID for old browsers (audit item 146)
function safeRandomUUID() {
  if (typeof crypto?.randomUUID === 'function') return crypto.randomUUID();
  /* RFC 4122 v4 fallback using crypto.getRandomValues if present */
  const bytes = new Uint8Array(16);
  if (crypto?.getRandomValues) crypto.getRandomValues(bytes);
  else for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const h = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
/* Defensive setItem helper — localStorage on iOS Safari Private mode
 * throws QuotaExceededError on every write, and Android Webview can
 * fail under low memory. Round 7 fix (audit item 211): the previous
 * raw localStorage.setItem calls would throw and propagate, breaking
 * registration entirely on private-mode browsers. */
function safeSetItem(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch (e) {
    console.warn('[storage] setItem failed:', key, e.name);
    return false;
  }
}
if (!deviceId) {
  deviceId = 'dev-' + safeRandomUUID();
  safeSetItem('ep_device_id', deviceId);
}

// ─── IndexedDB for offline queue ────────────────────────────────────────
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('checkin-queue', 1);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore('queue', {keyPath: 'id', autoIncrement: true});
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function addToQueue(sessionCode) {
  const db = await openDB();
  const tx = db.transaction('queue', 'readwrite');
  tx.objectStore('queue').add({
    /* Queue uses quick-checkin (device-keyed, no auth round trip).
     * On drain we prefer /attendance/batch-checkin for a single transaction. */
    code: sessionCode,
    device_uuid: deviceId,
    timestamp: Date.now(),
  });
  updateQueueCount();
}

async function getQueueCount() {
  const db = await openDB();
  return new Promise(resolve => {
    const tx = db.transaction('queue', 'readonly');
    const req = tx.objectStore('queue').count();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(0);
  });
}

async function processQueue() {
  const db = await openDB();
  const tx = db.transaction('queue', 'readonly');
  const store = tx.objectStore('queue');
  const items = await new Promise(r => { const req = store.getAll(); req.onsuccess = () => r(req.result); });
  if (items.length === 0) return;

  /* Group by session code, drain each group in a single batch-checkin call */
  const bySession = {};
  for (const it of items) {
    const code = it.code || (it.body && JSON.parse(it.body).session_code);
    if (!code) continue;
    (bySession[code] = bySession[code] || []).push(it);
  }

  let synced = 0, dropped = 0;
  for (const [code, group] of Object.entries(bySession)) {
    try {
      const r = await fetch(`${API}/attendance/batch-checkin`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          session_code: code,
          items: group.map(g => ({device_uuid: g.device_uuid || deviceId})),
        }),
      });
      if (r.status === 404) {
        /* Session is gone (expired or restarted). The queued items can
         * never succeed, so drop them so the queue does not grow
         * indefinitely. The user has already seen "Queued" feedback. */
        const dtx = db.transaction('queue', 'readwrite');
        const dst = dtx.objectStore('queue');
        for (const g of group) dst.delete(g.id);
        dropped += group.length;
        continue;
      }
      if (!r.ok) continue;
      const d = await r.json();
      /* All attempted rows are now resolved server-side (accepted OR duplicate
       * OR unknown) — drop all of them from the queue regardless. Duplicate
       * means already checked in (success in real life), unknown means the
       * device was unlinked and retrying won't help. */
      const dtx = db.transaction('queue', 'readwrite');
      const dst = dtx.objectStore('queue');
      for (const g of group) dst.delete(g.id);
      synced += (d.accepted || 0) + (d.duplicates || 0);
    } catch (e) { break; }
  }

  if (synced > 0) {
    showStatus(`✓ Synced ${synced} check-in${synced > 1 ? 's' : ''}`, 'success');
  }
  if (dropped > 0) {
    showStatus(`⚠ Dropped ${dropped} stale check-in${dropped > 1 ? 's' : ''} (session expired)`, 'error');
  }
  updateQueueCount();
}

async function updateQueueCount() {
  const n = await getQueueCount();
  const el = document.getElementById('queue-count');
  if (n === 0) { el.textContent = ''; el.className = 'queue-count'; return; }
  /* Find the oldest pending item to show staleness */
  const db = await openDB();
  const items = await new Promise(r => {
    const req = db.transaction('queue', 'readonly').objectStore('queue').getAll();
    req.onsuccess = () => r(req.result);
  });
  const oldest = items.length ? Math.min(...items.map(i => i.timestamp || Date.now())) : Date.now();
  const ageSec = Math.floor((Date.now() - oldest) / 1000);
  const ageStr = ageSec < 60 ? `${ageSec}s` : ageSec < 3600 ? `${Math.floor(ageSec/60)}m` : `${Math.floor(ageSec/3600)}h`;
  el.textContent = `${n} pending · oldest ${ageStr}`;
  /* Highlight if anything is stuck > 60 s */
  el.className = 'queue-count' + (ageSec > 60 ? ' stale' : '');
}

/* Opportunistic drain — fires every 15 s regardless of online events.
 * Catches network flaps that don't trigger window.online (very common on
 * unstable wifi or carrier handoff). */
let drainInterval = setInterval(async () => {
  const n = await getQueueCount();
  if (n > 0 && navigator.onLine) processQueue();
}, 15000);

/* Round 7 fix (audit item 214): clear the timer when the page is
 * hidden or unloaded. Webkit on iOS and recent Chrome put hidden
 * tabs to sleep, but Android Webview will keep firing the interval
 * for hours, draining battery for no reason. We restart the
 * interval on visibility change. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(drainInterval);
    drainInterval = null;
  } else if (!drainInterval) {
    drainInterval = setInterval(async () => {
      const n = await getQueueCount();
      if (n > 0 && navigator.onLine) processQueue();
    }, 15000);
    /* Drain immediately on resume so a queue that grew while hidden
     * gets caught up the moment the user looks at the screen. */
    if (navigator.onLine) processQueue();
  }
});
window.addEventListener('beforeunload', () => {
  if (drainInterval) clearInterval(drainInterval);
});

// ─── Online/Offline detection ───────────────────────────────────────────
window.addEventListener('online', () => {
  isOnline = true;
  document.getElementById('offline-badge').classList.remove('show');
  processQueue(); // sync when back online
});
window.addEventListener('offline', () => {
  isOnline = false;
  document.getElementById('offline-badge').classList.add('show');
});
if (!isOnline) document.getElementById('offline-badge').classList.add('show');

// ─── Service Worker Registration ────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/attend/sw.js').then(reg => {
    // Register background sync
    if ('sync' in reg) {
      reg.sync.register('sync-checkins').catch(() => {});
    }
  });
  /* Listen for SW updated message — show a banner so attendees know
   * a fresh version is live (audit item 121). */
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data?.type === 'sw-updated') {
      showStatus('🔄 Versi baru tersedia — refresh halaman.', 'info');
    }
  });
}

// ─── Browser-environment hint (audit items 144, 146) ─────────────────
(function detectBrowser() {
  const ua = navigator.userAgent;
  const inApp =
    /FBAN|FBAV|Instagram|Line\/|MicroMessenger|Twitter|TikTok|WhatsApp/i.test(ua);
  const noUUID = typeof crypto?.randomUUID !== 'function';
  if (inApp || noUUID) {
    const el = document.getElementById('browser-warn');
    if (el) {
      el.style.display = 'block';
      if (noUUID) el.textContent =
        '⚠ Browser kamu terlalu lama. Update Chrome / Safari atau buka di browser lain.';
    }
  }
})();

// ─── Auth ───────────────────────────────────────────────────────────────
(async () => {
  /* Resolve the best endpoint (LAN if reachable, else tunnel) before
   * any other request fires. This makes the difference between 100 %
   * pass at 2,000 concurrent (LAN) and ~30 % pass (tunnel free tier). */
  API = await resolveApi();

  if (token) {
    try {
      const r = await fetch(`${API}/auth/me`, {headers:{'Authorization':`Bearer ${token}`}});
      if (r.ok) {
        const u = await r.json();
        userName = u.name; userTeam = u.team;
        showScanPhase();
        return;
      }
      /* Round 7 fix (audit item 217): distinguish "server says token
       * is bad" from "we couldn't reach the server". A 401/403 means
       * we should clear the stored token and force re-login; a
       * network failure (catch branch below) should keep the token
       * and show scan phase optimistically. */
      if (r.status === 401 || r.status === 403) {
        token = '';
        try { localStorage.removeItem('ep_token'); } catch (_) {}
        showStatus('Sesi login habis. Silakan login ulang.', 'info');
        return;
      }
    } catch(e) {
      // Offline but have token — show scan anyway
      userName = localStorage.getItem('ep_name') || 'Offline User';
      userTeam = localStorage.getItem('ep_team') || '—';
      showScanPhase();
      return;
    }
    token = '';
    try { localStorage.removeItem('ep_token'); } catch (_) {}
  }
})();

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = `status ${type}`;
  if (type === 'success' || type === 'queued') setTimeout(() => el.style.display = 'none', 5000);
}

function showScanPhase() {
  document.getElementById('auth-card').classList.add('hidden');
  document.getElementById('scan-phase').classList.remove('hidden');
  document.getElementById('user-name').textContent = userName;
  document.getElementById('user-team').textContent = userTeam;
  document.getElementById('user-device').textContent = deviceId.slice(0, 16) + '...';
  loadHistory();
  updateQueueCount();
}

/* Translate common server error messages to Indonesian for UX. The
 * server still emits English (which is convenient for log analysis);
 * the PWA acts as the user-facing translation layer. Keys are
 * substring-match so partial messages still translate. */
const I18N = {
  'session not found, inactive, or expired': 'Sesi absen sudah berakhir atau belum dibuka. Hubungi panitia.',
  'already checked in for this session': 'Sudah absen sebelumnya. Tetap dianggap hadir ✓',
  'device not linked, please register first': 'HP belum terdaftar — silakan daftar dulu.',
  'invalid signed session code': 'QR ini tidak valid. Pastikan dari panitia resmi.',
  'rate limit exceeded': 'Terlalu cepat — coba sebentar lagi.',
  'request body too large': 'Permintaan terlalu besar.',
  'session_code and device_uuid are required': 'Data tidak lengkap.',
  'invalid email or password': 'Email atau password salah.',
  'email already registered': 'Email sudah terdaftar — coba login.',
  'format email tidak valid': 'Format email tidak valid.',
  'password minimal 6 karakter': 'Password minimal 6 karakter.',
  'name, email, team, and password are required': 'Nama, email, tim, dan password wajib diisi.',
  'missing token': 'Sesi login habis. Silakan login ulang.',
  'invalid or expired token': 'Sesi login habis. Silakan login ulang.',
};
function localiseError(msg) {
  if (!msg) return 'Terjadi kesalahan.';
  for (const [k, v] of Object.entries(I18N)) {
    if (msg.toLowerCase().includes(k.toLowerCase())) return v;
  }
  return msg;
}

async function authRegister() {
  const name = document.getElementById('a-name').value.trim();
  const email = document.getElementById('a-email').value.trim();
  const team = document.getElementById('a-team').value.trim();
  const password = document.getElementById('a-password').value;
  if (!name || !email || !team || !password) { showStatus('Lengkapi semua kolom', 'error'); return; }
  if (password.length < 6) { showStatus('Password minimal 6 karakter', 'error'); return; }
  try {
    const r = await fetch(`${API}/auth/register`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, email, team, password})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(localiseError(d.error));
    token = d.token;
    safeSetItem('ep_token', token);
    safeSetItem('ep_name', d.participant.name);
    safeSetItem('ep_team', d.participant.team);
    userName = d.participant.name;
    userTeam = d.participant.team;
    await fetch(`${API}/device/link`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body: JSON.stringify({device_uuid: deviceId, user_agent: navigator.userAgent})
    });
    showStatus('✓ Pendaftaran berhasil!', 'success');
    showScanPhase();
  } catch(e) { showStatus(localiseError(e.message), 'error'); }
}

async function authLogin() {
  const email = document.getElementById('a-email').value.trim();
  const password = document.getElementById('a-password').value;
  if (!email || !password) { showStatus('Isi email & password', 'error'); return; }
  try {
    const r = await fetch(`${API}/auth/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(localiseError(d.error));
    token = d.token;
    safeSetItem('ep_token', token);
    safeSetItem('ep_name', d.participant.name);
    safeSetItem('ep_team', d.participant.team);
    userName = d.participant.name;
    userTeam = d.participant.team;
    await fetch(`${API}/device/link`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body: JSON.stringify({device_uuid: deviceId, user_agent: navigator.userAgent})
    });
    showStatus('✓ Login berhasil!', 'success');
    showScanPhase();
  } catch(e) { showStatus(localiseError(e.message), 'error'); }
}

/* Show manual code entry form (audit item 104, 144) — fallback when
 * camera is denied or in-app browser blocks QR access. */
function showManualEntry() {
  document.getElementById('manual-entry').classList.remove('hidden');
  document.getElementById('btn-manual').classList.add('hidden');
  document.getElementById('manual-code').focus();
}
async function submitManualCode() {
  const raw = document.getElementById('manual-code').value.trim();
  if (!raw) { showStatus('Masukkan kode dulu', 'error'); return; }
  /* Round 7 fix (audit item 215): validate manual entry with the
   * same regex the scanner uses (`8 alnum` optionally followed by
   * `.16-hex`). Anything else gets rejected client-side rather
   * than a confusing 400 from the server. */
  if (!/^[A-Za-z0-9]{8}(\.[a-f0-9]{16})?$/.test(raw)) {
    showStatus('Kode harus 8 huruf/angka. Cek lagi ya.', 'error');
    return;
  }
  await processCheckin(raw);
  document.getElementById('manual-code').value = '';
}

// ─── Scanner ────────────────────────────────────────────────────────────
function startScan() {
  document.getElementById('btn-start-scan').classList.add('hidden');
  if (typeof Html5Qrcode === 'undefined') {
    showStatus('Library QR belum siap. Cek koneksi atau gunakan input manual.', 'error');
    document.getElementById('btn-start-scan').classList.remove('hidden');
    return;
  }
  scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onScanSuccess,
    () => {}
  ).catch(err => {
    showStatus('Camera: ' + err, 'error');
    document.getElementById('btn-start-scan').classList.remove('hidden');
  });
}

/* Smart retry helper — same idempotency-aware retry the load test uses.
 * device_uuid + session_code is unique server-side, so retries cannot
 * cause duplicate attendance. */
async function fetchWithRetry(url, init, opts = {}) {
  const PER_TRY_TIMEOUT = opts.timeout || 6000;
  const MAX_TRIES = opts.maxTries || 5;
  let lastErr;
  for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), PER_TRY_TIMEOUT);
    try {
      const r = await fetch(url, {...init, signal: ctl.signal});
      clearTimeout(timer);
      /* 2xx and 4xx are deterministic — return immediately */
      if (r.status < 500) return r;
      lastErr = new Error('server ' + r.status);
    } catch (e) {
      clearTimeout(timer);
      lastErr = e;
    }
    /* On the third failed attempt, re-probe endpoints — maybe the
     * tablet's LAN IP changed (DHCP renew, AP roam) or the LAN went
     * down and we need to switch to tunnel. */
    if (attempt === 3) {
      try { await reresolve(); } catch (_) {}
      /* Rewrite the URL if it pointed at the old endpoint */
      const oldOrigin = new URL(url).origin;
      if (oldOrigin !== API) url = url.replace(oldOrigin, API);
    }
    /* Jittered exponential backoff: 100, 200, 400, 800 ms ± 30 % */
    const base = 100 * Math.pow(2, attempt - 1);
    const delay = base + Math.floor(Math.random() * base * 0.6);
    await new Promise(r => setTimeout(r, delay));
  }
  throw lastErr || new Error('all retries exhausted');
}

async function onScanSuccess(decoded) {
  /* Round 7 fix (audit item 220): scanner.stop() can throw if the
   * underlying camera stream was already torn down (e.g., user
   * switched tabs mid-scan). Wrap in try so the rest of the
   * pipeline still runs. */
  if (scanner) {
    try { await scanner.stop(); } catch (_) {}
    scanner = null;
  }
  document.getElementById('btn-start-scan').classList.remove('hidden');

  let data;
  try { data = JSON.parse(decoded); }
  catch(e) {
    /* Maybe the QR contains the bare code or signed_code as plain text */
    if (/^[A-Za-z0-9]{8}(\.[a-f0-9]{16})?$/.test(decoded.trim())) {
      data = decoded.trim().includes('.') ? {signed_code: decoded.trim()} : {code: decoded.trim()};
    } else {
      showStatus('QR tidak valid. Pastikan dari panitia.', 'error'); return;
    }
  }

  /* Accept either:
   *   { code: "ABC12345" }            (legacy plain code)
   *   { signed_code: "ABC12345.HEX" } (modern signed payload)
   * The signed payload is verified server-side; we forward it as
   * session_code and the server will reject if the signature is
   * forged. */
  const sessionCode = data.signed_code || data.code;
  if (!sessionCode) { showStatus('Format QR tidak dikenali', 'error'); return; }
  await processCheckin(sessionCode);
}

/* Shared check-in pipeline used by both QR scan and manual entry.
 * `sessionCode` may be plain `ABC12345` or `ABC12345.SIGHEX`. */
async function processCheckin(sessionCode) {
  if (!sessionCode) return;

  // Try online first
  if (isOnline) {
    try {
      const r = await fetchWithRetry(`${API}/attendance/quick-checkin`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({session_code: sessionCode, device_uuid: deviceId})
      });
      const d = await r.json();
      if (r.ok) {
        const inGrace = d.grace === true;
        showStatus(inGrace
          ? '✓ Hadir tercatat (toleransi waktu)'
          : '✓ Hadir tercatat — terima kasih!', 'success');
        addHistoryItem(new Date().toISOString(), true);
        return;
      }
      if (r.status === 409) {
        /* Already checked in — celebrate, not reject (audit item 152) */
        showStatus('✓ Sudah absen sebelumnya, tetap dianggap hadir', 'info');
        return;
      }
      if (r.status === 401) {
        /* Device not linked — fall back to authenticated checkin which links on the fly */
        const fb = await fetchWithRetry(`${API}/attendance/checkin`, {
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
          body: JSON.stringify({session_code: sessionCode, device_id: deviceId})
        });
        const fd = await fb.json();
        if (fb.ok) {
          showStatus('✓ Hadir tercatat — terima kasih!', 'success');
          addHistoryItem(new Date().toISOString(), true);
          return;
        }
        if (fb.status === 409) {
          showStatus('✓ Sudah absen sebelumnya, tetap dianggap hadir', 'info');
          return;
        }
        throw new Error(fd.error || 'server error');
      }
      throw new Error(d.error || 'server error');
    } catch(e) {
      /* All retries exhausted → queue offline */
      await addToQueue(sessionCode);
      showStatus('📦 Disimpan, akan otomatis tersinkron', 'queued');
      addHistoryItem(new Date().toISOString(), false);
      triggerSync();
      return;
    }
  }

  // Offline — queue locally
  await addToQueue(sessionCode);
  showStatus('📦 Tersimpan offline — akan tersinkron otomatis', 'queued');
  addHistoryItem(new Date().toISOString(), false);
  triggerSync();
}

function triggerSync() {
  if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then(reg => {
      if ('sync' in reg) reg.sync.register('sync-checkins');
    });
  }
}

async function loadHistory() {
  try {
    if (!isOnline) return;
    const r = await fetch(`${API}/attendance/me`, {headers:{'Authorization':`Bearer ${token}`}});
    if (!r.ok) return;
    const list = await r.json();
    for (const item of list.slice(0, 5)) {
      addHistoryItem(item.checkedInAt, true);
    }
  } catch(e) {}
}

function addHistoryItem(ts, synced) {
  const el = document.createElement('div');
  el.className = 'history-item';
  el.innerHTML = `<span class="dot ${synced ? 'synced' : 'pending'}"></span><span class="text">${new Date(ts).toLocaleString(undefined,{hour12:false})}</span>`;
  const hist = document.getElementById('history');
  if (hist.children.length > 1) hist.insertBefore(el, hist.children[1]);
  else hist.appendChild(el);
  /* Round 7 fix (audit item 212): cap the rendered history list at
   * 50 entries. Without this, a user who keeps the PWA open across
   * a multi-day event would accumulate hundreds of DOM nodes; on
   * a low-RAM Android Webview that turns into noticeable jank
   * within a few hundred. The first child is the <h3> header. */
  while (hist.children.length > 51) hist.removeChild(hist.lastElementChild);
}
