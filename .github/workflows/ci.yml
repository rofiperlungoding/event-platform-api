name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev

      - name: Compile server
        run: cc -O2 -Wall -o event-server server.c -lpq

      - name: Validate shell scripts
        run: |
          for f in deploy/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "All shell scripts have valid syntax."

      - name: Verify binary
        run: |
          test -x event-server
          ls -la event-server
